name: CI

# Chạy cả khi push lẫn khi mở pull request: bắt lỗi TRƯỚC khi code vào nhánh
# chính mới là mục đích của CI, chứ không phải báo lỗi sau khi đã merge.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ─────────────────────────────────────────────────────────────
  # 1. Chạy checkpoint trên một máy sạch
  # ─────────────────────────────────────────────────────────────
  test:
    name: Chạy pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Cài dependency
        run: pip install -r requirements.txt

      - name: Chạy test CP1–CP4
        # test_cp5.py gọi vào bản deploy đang sống, test_bonus_cicd.py kiểm tra
        # badge của chính workflow này — cả hai đều không thuộc về CI.
        # -m "not docker" để job này nhẹ; việc build image là của job `build`.
        env:
          AGENT_API_KEY: ci-dummy
          REDIS_URL: "fake://"
        run: pytest tests/ -v --ignore=tests/test_cp5.py --ignore=tests/test_bonus_cicd.py -m "not docker"

  # ─────────────────────────────────────────────────────────────
  # 2. Build image trên môi trường sạch — bắt lỗi "máy tôi build được"
  # ─────────────────────────────────────────────────────────────
  build:
    name: Build Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t day12-agent:ci .

      - name: Kiểm tra dung lượng image
        run: docker images day12-agent:ci --format "{{.Repository}}:{{.Tag}} {{.Size}}"

  # ─────────────────────────────────────────────────────────────
  # 3. Deploy — chỉ khi test và build đều xanh
  # ─────────────────────────────────────────────────────────────
  deploy:
    name: Deploy lên Railway
    runs-on: ubuntu-latest
    # needs: đợi cả hai job trên PASS. Thiếu dòng này thì các job chạy song song
    # và code hỏng vẫn lên production trong khi test đang đỏ.
    needs: [test, build]
    # if: chỉ deploy từ nhánh main và chỉ khi push. Không có nó thì mỗi lần ai đó
    # mở pull request là một lần deploy.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Deploy
        env:
          # Token nằm ở repo → Settings → Secrets and variables → Actions.
          # Dán thẳng vào file này là nó nằm trong lịch sử git vĩnh viễn.
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "::warning::Chưa cấu hình secret RAILWAY_TOKEN — bỏ qua bước deploy."
            exit 0
          fi
          npm install -g @railway/cli
          railway up --detach
