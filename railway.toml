# CP5 — Cấu hình deploy Railway (dùng nếu bạn chọn Railway).
#
# Các biến môi trường KHÔNG khai báo ở đây. Đặt chúng trong dashboard hoặc:
#     railway variables --set AGENT_API_KEY=...
#
# Railway tự gán biến PORT — app phải đọc $PORT, đừng cố định 8000.

[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[deploy]
# Không khai báo startCommand: Railway chạy lệnh này KHÔNG qua shell, nên
# ${PORT:-8000} sẽ không được nở ra. Để trống thì Railway dùng CMD trong
# Dockerfile — CMD đó đã bọc "sh -c" nên shell nở biến PORT đúng cách.
healthcheckPath = "/health"
healthcheckTimeout = 100
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
